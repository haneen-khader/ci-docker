name: CI - Test, Coverage, Docker Build & Run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: pytest --cov=app

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker build -t flask-ci-docker .

      - name: Run container
        run: docker run -d -p 5000:5000 --name flask-container flask-ci-docker

      - name: Wait for container
        run: sleep 5

      - name: Verify container response
        run: curl http://localhost:5000

      - name: Show container logs
        run: docker logs flask-container

      - name: Stop container
        run: docker stop flask-container && docker rm flask-container
